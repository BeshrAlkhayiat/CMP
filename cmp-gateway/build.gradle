plugins {
    id 'java'
    id 'application'
}

group = 'com.siemens.pki.cmpgateway'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    flatDir {
        dirs '../cmp-ra-component/target'
    }
}

dependencies {
    // Siemens CMP RA Component
    implementation files('../cmp-ra-component/target/CmpRaComponent-4.3.0.jar')
    
    // Bouncy Castle
    implementation 'org.bouncycastle:bcprov-jdk18on:1.79'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.79'
    
    // SLF4J for logging (required by cmp-ra-component)
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    
    // JSON processing
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    
    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'com.siemens.pki.cmpgateway.Main'
}

tasks.named('test') {
    useJUnit()
}

task runGateway(type: JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
}
